# Modeled on builder_example's CI (checkout → ./build <flavor>): all Hetzner flavors, dev
# signing certs for the USI variants. On TAG builds the artifacts are published as GitHub
# RELEASE assets (public, permanent, plain-URL downloadable — hcloud-upload-image consumes
# them via --image-url); run artifacts (login-only, 90-day expiry) are not a distribution
# channel. arm64 flavors build NATIVELY on GitHub's free-for-public-repos arm64 runners.
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write # gh release create/upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # hcloud classic: BIOS+UEFI dual-boot raw — boots every family incl. BIOS-only CX; no in-place.
          - flavor: hcloud-gardener_prod-amd64
            runner: ubuntu-24.04
          # hcloud USI: EFI-only (CPX/CCX/CAX), A/B in-place-capable via gardenlinux-update.
          - flavor: hcloud-gardener_prod_usi-amd64
            runner: ubuntu-24.04
          - flavor: hcloud-gardener_prod-arm64
            runner: ubuntu-24.04-arm
          - flavor: hcloud-gardener_prod_usi-arm64
            runner: ubuntu-24.04-arm
          # Robot dedicated: full kernel (igb/AHCI/mdadm), BIOS+UEFI dual, NO cloud-init
          # (Robot has no metadata service — bootstrap is the onboarding agent's job).
          - flavor: baremetal-robot-gardener_prod-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # features/_usi/exec.post hard-requires cert/oci-sign.crt + cert/secureboot.{pk,null.pk,
      # kek,db}.auth (bakes the OCI-signature verification key + secureboot enrollment blobs
      # into the image). Self-signed dev chain for now; a real release pipeline signs USI
      # artifacts with THIS key (gardenlinux-update verifies) — key custody TBD
      # (consider --kms like upstream).
      - name: Generate signing certs (dev, self-signed)
        run: ./cert/build oci-sign.crt secureboot.pk.auth secureboot.null.pk.auth secureboot.kek.auth secureboot.db.auth

      - name: Build ${{ matrix.flavor }}
        run: ./build ${{ matrix.flavor }}

      # hcloud-upload-image consumes .raw.xz directly (--compression xz); keeps assets <~1GB.
      - name: Compress raw images
        run: xz -T0 -9 .build/*.raw

      # Run artifacts: CI debugging + workflow_dispatch builds. include-hidden-files because
      # the builder's output dir .build/ is hidden and upload-artifact@v4 skips hidden paths.
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}
          include-hidden-files: true
          path: |
            .build/*.raw.xz
            .build/*.uki
            .build/*.esp.tar
            .build/*.manifest
            .build/*.release
          if-no-files-found: error

      # Tag builds additionally publish to the GitHub Release — the actual distribution
      # channel. Matrix jobs race on `release create`; the `|| true` + `upload --clobber`
      # combination makes that race harmless.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Garden Linux flavors for Hetzner Cloud & Robot — see README. Tag scheme: <GL-version>-<config-revision>." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" --clobber .build/*.raw.xz .build/*.manifest .build/*.release
          ls .build/*.uki >/dev/null 2>&1 && gh release upload "$GITHUB_REF_NAME" --clobber .build/*.uki .build/*.esp.tar || true
