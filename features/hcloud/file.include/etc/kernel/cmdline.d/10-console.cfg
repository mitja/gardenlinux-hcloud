# Modeled on features/kvm's console snippet (hcloud VMs are KVM/QEMU). Ordering differs from
# kvm on purpose: tty0 LAST so /dev/console lands on the display — the hcloud web "Console" is
# noVNC on the VGA device, and there is no user-reachable serial port on Hetzner Cloud. Serial
# stays first for completeness (earlycon + hypothetical debugging).
serial_dev=ttyS0
earlycon="earlyprintk=$serial_dev,115200n8"

if [ "$(arch)" = aarch64 ]; then
	# CAX (arm64) — untested, staged for the docs/73 arm64 catalog decision.
	serial_dev=ttyAMA0
	earlycon="earlycon=pl011,mmio,0x09000000"
fi

CMDLINE_LINUX="$earlycon console=$serial_dev console=tty0 $CMDLINE_LINUX"
